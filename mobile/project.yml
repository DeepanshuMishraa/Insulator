name: InsulatorMobile
options:
  bundleIdPrefix: com.dipxsy
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: YY5H9WM46P
targets:
  InsulatorMobile:
    type: application
    platform: iOS
    sources:
      - InsulatorMobile
    info:
      path: InsulatorMobile/Info.plist
      properties:
        CFBundleDisplayName: Insulator
        NSLocalNetworkUsageDescription: Connect to your Insulator daemon over your private Tailscale network.
        NSCameraUsageDescription: Take photos to attach them to your chat with Insulator.
        NSPhotoLibraryUsageDescription: Select photos from your library to attach them to your chat with Insulator.
        NSMicrophoneUsageDescription: Insulator listens while you dictate a message.
        NSSpeechRecognitionUsageDescription: Insulator turns your dictation into text on this iPhone.
        CFBundleURLTypes:
          - CFBundleURLName: com.dipxsy.insulatorMobile.pair
            CFBundleURLSchemes:
              - insulator
        UIAppFonts:
          - Geist[wght].ttf
          - Geist-Italic[wght].ttf
          - GeistMono[wght].ttf
          - PaperMono[wght].ttf
          - Inter[opsz,wght].ttf
          - InstrumentSans[wdth,wght].ttf
          - Newsreader[opsz,wght].ttf
          - SourceSerif4[opsz,wght].ttf
          - Lora[wght].ttf
          - JetBrainsMono[wght].ttf
          - JetBrainsMono-Italic[wght].ttf
          - Manrope[wght].ttf
          - Poppins-Regular.ttf
          - Poppins-Italic.ttf
          - Poppins-Medium.ttf
          - Poppins-MediumItalic.ttf
          - Poppins-SemiBold.ttf
          - Poppins-SemiBoldItalic.ttf
          - Poppins-Bold.ttf
          - Poppins-BoldItalic.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dipxsy.insulatorMobile
        PRODUCT_NAME: InsulatorMobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
  InsulatorMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InsulatorMobileTests
    dependencies:
      - target: InsulatorMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  InsulatorMobile:
    build:
      targets:
        InsulatorMobile: all
        InsulatorMobileTests: [test]
    test:
      targets:
        - InsulatorMobileTests
